name: Comprehensive CI Workflow
on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
      - run: yarn --frozen-lockfile

      - name: Build application
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
      - run: yarn build

      - name: Run unit tests
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
      - run: yarn test-unit